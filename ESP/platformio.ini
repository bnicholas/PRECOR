; PlatformIO project for the Precor CSAFE ESP32 probe.
;
; Two build environments:
;   usb  - first flash over USB (default)
;   ota  - wireless flash once the device is on Wi-Fi (Claude Code / you can
;          push firmware with: pio run -e ota -t upload)
;
; See README.md for the full workflow.

[platformio]
default_envs = usb

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    links2004/WebSockets@^2.4.1

[env:usb]
upload_speed = 921600

[env:ota]
; Set upload_port to the device's mDNS name or IP on your LAN.
upload_protocol = espota
upload_port = precor-csafe-esp.local
upload_flags =
    --auth=precor-ota
