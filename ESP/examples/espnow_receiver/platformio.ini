; ESP-NOW telemetry receiver — flash to a SECOND ESP32 that acts as the game
; host bridge. It listens for the probe's TelemetryPacket broadcasts and prints
; each one as a JSON line over USB serial (115200), so a laptop / game can read
; them straight off /dev/ttyUSB*.
;
;   pio run -t upload && pio device monitor
;
; The receiver shares the wire-format header with the probe via -I ../../include.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -I ../../include
    ; The receiver MUST be on the same Wi-Fi channel as the probe. Check the
    ; probe's `GET /` -> wifi.channel, then set it here and re-flash:
    ; -DRX_CHANNEL=6
